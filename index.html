<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        .heading { font-family: 'Playfair Display', sans-serif; }

        .hero-bg {
            background: linear-gradient(135deg, rgba(190,18,60,0.9), rgba(126,34,206,0.85)), 
                        url('images/hero-bg.jpg') center/cover no-repeat fixed;
        }

        .gallery-img {
            transition: all 0.4s ease;
        }
        .gallery-img:hover {
            transform: scale(1.08);
            filter: brightness(1.1);
        }
        
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.97);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-zinc-950 text-white">

    <!-- Affiliate Top Banner -->
    <a href="https://www.profitablecpmratenetwork.com/d7ctaq4g?key=163059a9717a51ba0b50a9a9fd33df31" 
       target="_blank" class="block bg-gradient-to-r from-pink-600 to-purple-600 py-3 text-center font-bold text-lg hover:brightness-110">
        🔥 Meet Real Singles Now - Click Here →
    </a>

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-black/90 backdrop-blur-lg border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-4xl">❤️</span>
                <h1 class="text-4xl font-bold heading">Love Life</h1>
            </div>
            <a href="https://www.profitablecpmratenetwork.com/d7ctaq4g?key=163059a9717a51ba0b50a9a9fd33df31" 
               target="_blank"
               class="bg-white text-black px-8 py-3.5 rounded-full font-bold text-lg hover:bg-pink-500 hover:text-white transition-all">
                Join Now
            </a>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-bg min-h-screen flex items-center pt-20">
        <div class="max-w-6xl mx-auto px-6 text-center">
            <h1 class="text-6xl md:text-7xl lg:text-8xl font-bold heading leading-none mb-6">
                Find Love That Lasts
            </h1>
            <p class="text-2xl text-zinc-100 max-w-2xl mx-auto mb-10">
                Real people. Real connections. Start your love story today.
            </p>
            
            <a href="https://www.profitablecpmratenetwork.com/d7ctaq4g?key=163059a9717a51ba0b50a9a9fd33df31" 
               target="_blank"
               class="inline-block px-16 py-7 text-3xl font-bold bg-gradient-to-r from-pink-500 to-rose-600 rounded-3xl hover:scale-110 transition-all shadow-2xl">
                Join Now
            </a>
        </div>
    </section>

    <!-- ===================== PHOTO ALBUM FIRST ===================== -->
    <section id="gallery" class="py-20 bg-black">
        <div class="max-w-7xl mx-auto px-6">
            <div class="text-center mb-12">
                <h2 class="text-5xl font-bold heading">Photo Album</h2>
                <p class="text-zinc-400 text-xl mt-3">Click any photo to view full size</p>
            </div>
            
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="photo-grid"></div>

            <div class="text-center mt-16">
                <a href="https://www.profitablecpmratenetwork.com/d7ctaq4g?key=163059a9717a51ba0b50a9a9fd33df31" 
                   target="_blank"
                   class="inline-block px-16 py-7 text-2xl font-bold bg-gradient-to-r from-pink-500 to-rose-600 text-white rounded-3xl hover:scale-105 transition-all">
                    Join Now & Meet Them
                </a>
            </div>
        </div>
    </section>

    <!-- Lightbox Photo Viewer -->
    <div id="lightbox" onclick="if(event.target === this) closeLightbox()">
        <img id="lightbox-image" class="max-h-[92vh] max-w-[92vw] rounded-2xl shadow-2xl" alt="">
        <button onclick="prevImage()" class="absolute left-8 text-6xl bg-black/70 hover:bg-black w-16 h-16 rounded-full flex items-center justify-center">←</button>
        <button onclick="nextImage()" class="absolute right-8 text-6xl bg-black/70 hover:bg-black w-16 h-16 rounded-full flex items-center justify-center">→</button>
        <button onclick="closeLightbox()" class="absolute top-8 right-8 text-5xl bg-black/70 hover:bg-black w-16 h-16 rounded-full flex items-center justify-center">✕</button>
    </div>

    <script>
        // === ADD YOUR PHOTOS HERE (You can add more than 8) ===
        const photos = [
            "images/photo1.jpg",
            "images/photo2.jpg",
            "images/photo3.jpg",
            "images/photo4.jpg",
            "images/photo5.jpg",
            "images/photo6.jpg",
            "images/photo7.jpg",
            "images/photo8.jpg"
            // Add more like: "images/photo9.jpg",
        ];

        let currentIndex = 0;

        function renderGallery() {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = '';
            
            photos.forEach((src, index) => {
                const div = document.createElement('div');
                div.className = "overflow-hidden rounded-3xl cursor-pointer shadow-2xl";
                div.innerHTML = `<img src="${src}" class="gallery-img w-full aspect-[4/5] object-cover" onclick="openLightbox(${index})">`;
                grid.appendChild(div);
            });
        }

        function openLightbox(i) {
            currentIndex = i;
            document.getElementById('lightbox').style.display = "flex";
            document.getElementById('lightbox-image').src = photos[i];
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = "none";
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % photos.length;
            document.getElementById('lightbox-image').src = photos[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            document.getElementById('lightbox-image').src = photos[currentIndex];
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('lightbox').style.display === "flex") {
                if (e.key === "ArrowRight") nextImage();
                if (e.key === "ArrowLeft") prevImage();
                if (e.key === "Escape") closeLightbox();
            }
        });

        // Load gallery when page loads
        window.onload = renderGallery;
    </script>
</body>
</html>
