        ];

        function renderVideoGallery() {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';

            videos.forEach((video, index) => {
                const div = document.createElement('div');
                div.className = "video-card cursor-pointer overflow-hidden rounded-3xl bg-zinc-900";
                div.innerHTML = `
                    <div class="relative">
                        <img src="${video.thumbnail}" class="w-full aspect-video object-cover">
                        <div class="absolute inset-0 flex items-center justify-center">
                            <i class="fas fa-play-circle text-6xl text-white drop-shadow-lg"></i>
                        </div>
                    </div>
                    <div class="p-4">
                        <p class="font-medium line-clamp-2">${video.title}</p>
                    </div>
                `;
                div.onclick = () => playVideo(index);
                grid.appendChild(div);
            });
        }

        function playVideo(index) {
            const video = videos[index];
            const lightbox = document.getElementById('video-lightbox');
            const mainVideo = document.getElementById('main-video');
            
            mainVideo.src = video.videoUrl;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
        }

        function closeVideo() {
            const lightbox = document.getElementById('video-lightbox');
            const mainVideo = document.getElementById('main-video');
            mainVideo.pause();
            mainVideo.src = '';
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
        }

        // Close lightbox when clicking outside video
        document.getElementById('video-lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeVideo();
        });

        window.onload = renderVideoGallery;
    </script>
