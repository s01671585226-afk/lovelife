        // DOM Elements

        // Helper: Escape HTML
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // Render Video Gallery - Exactly as original design
        function renderVideoGallery() {
            if (!grid) return;
            grid.innerHTML = '';

            videos.forEach((video, index) => {
                const div = document.createElement('div');
                div.className = "video-card cursor-pointer overflow-hidden rounded-xl md:rounded-3xl bg-zinc-900";
                div.innerHTML = `
                    <div class="relative">
                        <img src="${video.thumbnail}" class="w-full aspect-video object-cover" alt="thumbnail" loading="lazy" onerror="this.src='https://placehold.co/400x300/2d2d3a/f43f5e?text=Video'">

                        </div>
                    </div>
                    <div class="p-3 md:p-4">
                        <p class="font-medium text-sm md:text-base line-clamp-2">${escapeHtml(video.title)}</p>
                    </div>
                `;
                div.onclick = () => playVideo(index);
                grid.appendChild(div);
            });
        }

        // Play Video Function
        function playVideo(index) {
            const video = videos[index];
            if (!video) return;
            
            mainVideo.src = video.videoUrl;
            lightbox.classList.remove('hidden');
            lightbox.classList.add('flex');
            document.body.classList.add('lightbox-open');
            
            mainVideo.play().catch(err => {
                console.log("Tap play to start video");
            });
        }

        // Close Video Function
        function closeVideo() {
            mainVideo.pause();
            mainVideo.src = '';
            lightbox.classList.add('hidden');
            lightbox.classList.remove('flex');
            document.body.classList.remove('lightbox-open');
        }

        // Close lightbox when clicking outside video
        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeVideo();
        });

        // Close on ESC key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('flex')) {
                closeVideo();
            }
        });

        // Initialize gallery on load
        window.addEventListener('DOMContentLoaded', () => {
            renderVideoGallery();
        });
    </script>
