<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Viral Video List</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header with buttons */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            padding: 10px 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f43f5e, #ec4899);
            color: white;
            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(244, 63, 94, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        /* Video List */
        .video-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .video-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .video-item:hover {
            background: rgba(244, 63, 94, 0.1);
            border-color: rgba(244, 63, 94, 0.3);
            transform: translateX(4px);
        }

        .video-number {
            font-size: 18px;
            font-weight: 700;
            color: #f43f5e;
            min-width: 40px;
            text-align: center;
        }

        .video-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: #1a1a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-thumb i {
            font-size: 24px;
            color: #f43f5e;
        }

        .video-info {
            flex: 1;
        }

        .video-title {
            font-size: 14px;
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .video-badge {
            font-size: 11px;
            color: #f43f5e;
        }

        .play-icon {
            color: #f43f5e;
            font-size: 18px;
            opacity: 0.7;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox-content {
            width: 90%;
            max-width: 900px;
            position: relative;
        }

        .lightbox-content video {
            width: 100%;
            border-radius: 16px;
            background: #000;
        }

        .close-lightbox {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.8;
        }

        .close-lightbox:hover {
            opacity: 1;
        }

        /* Footer text - minimal */
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 11px;
            color: #333;
        }

        @media (max-width: 500px) {
            body {
                padding: 15px;
            }
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
            .video-thumb {
                width: 50px;
                height: 50px;
            }
            .video-title {
                font-size: 13px;
            }
            .video-number {
                font-size: 16px;
                min-width: 35px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Two Buttons: Join Now & Watch Now -->
    <div class="header">
        <a href="https://www.profitablecpmratenetwork.com/d7ctaq4g?key=163059a9717a51ba0b50a9a9fd33df31" target="_blank" class="btn btn-primary">
            <i class="fa-solid fa-user-plus"></i> Join Now
        </a>
        <button onclick="scrollToVideoList()" class="btn btn-secondary">
            <i class="fa-solid fa-play"></i> Watch Now
        </button>
    </div>

    <!-- Video List Only -->
    <div class="video-list" id="video-list"></div>

    <div class="footer">
        <span>✦ trending viral videos ✦</span>
    </div>
</div>

<!-- Lightbox for video playback -->
<div id="lightbox" class="lightbox">
    <div class="lightbox-content">
        <button class="close-lightbox" onclick="closeLightbox()">✕</button>
        <video id="lightbox-video" controls></video>
    </div>
</div>

<script>
    // Video data - Replace with your actual video files and thumbnails
    const videos = [
        {
            title: "🔥 College Romance Goes Viral - 12M Views",
            thumbnail: "https://placehold.co/200x200/1e1e2e/f43f5e?text=V1",
            videoUrl: "videos/video1.mp4"
        },
        {
            title: "❤️ Emotional Love Confession (TikTok Hit)",
            thumbnail: "https://placehold.co/200x200/2a1a2e/ec4899?text=V2",
            videoUrl: "videos/video2.mp4"
        },
        {
            title: "💋 Unexpected Kiss Compilation",
            thumbnail: "https://placehold.co/200x200/1a1a2e/a855f7?text=V3",
            videoUrl: "videos/video3.mp4"
        },
        {
            title: "🌅 Sunset Proposal That Broke Internet",
            thumbnail: "https://placehold.co/200x200/261c2f/d946ef?text=V4",
            videoUrl: "videos/video4.mp4"
        },
        {
            title: "🎁 Surprise Gift Reaction - Most Heartwarming",
            thumbnail: "https://placehold.co/200x200/1e1a2f/fb7185?text=V5",
            videoUrl: "videos/video5.mp4"
        },
        {
            title: "✈️ Long Distance Love Reunion",
            thumbnail: "https://placehold.co/200x200/2c1c2c/fc5c7c?text=V6",
            videoUrl: "videos/video6.mp4"
        },
        {
            title: "💒 Wedding Dance That Went Viral",
            thumbnail: "https://placehold.co/200x200/252525/e87979?text=V7",
            videoUrl: "videos/video7.mp4"
        },
        {
            title: "📱 Best Friends to Lovers Story",
            thumbnail: "https://placehold.co/200x200/1f1a2e/f9a8d4?text=V8",
            videoUrl: "videos/video8.mp4"
        },
        {
            title: "🎬 Romantic Movie Real Life Moment",
            thumbnail: "https://placehold.co/200x200/2d1b2e/f472b0?text=V9",
            videoUrl: "videos/video9.mp4"
        },
        {
            title: "🔥 Most Shared Couple Challenge",
            thumbnail: "https://placehold.co/200x200/1e293b/ff8c9e?text=V10",
            videoUrl: "videos/video10.mp4"
        },
        {
            title: "💖 First Date That Melted Hearts",
            thumbnail: "https://placehold.co/200x200/2a1a2e/c084fc?text=V11",
            videoUrl: "videos/video11.mp4"
        },
        {
            title: "📸 Cute Proposal Flashmob",
            thumbnail: "https://placehold.co/200x200/241f31/ff4d6d?text=V12",
            videoUrl: "videos/video12.mp4"
        }
    ];

    const videoListEl = document.getElementById('video-list');
    const lightbox = document.getElementById('lightbox');
    const lightboxVideo = document.getElementById('lightbox-video');

    // Render video list
    function renderVideoList() {
        videoListEl.innerHTML = '';

        videos.forEach((video, index) => {
            const item = document.createElement('div');
            item.className = 'video-item';
            item.onclick = () => playVideo(index);

            item.innerHTML = `
                <div class="video-number">${(index + 1).toString().padStart(2, '0')}</div>
                <div class="video-thumb">
                    <img src="${video.thumbnail}" alt="thumbnail" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-play\'></i>'">
                </div>
                <div class="video-info">
                    <div class="video-title">${escapeHtml(video.title)}</div>
                    <div class="video-badge"><i class="fa-regular fa-eye"></i> trending</div>
                </div>
                <div class="play-icon">
                    <i class="fa-solid fa-circle-play"></i>
                </div>
            `;

            videoListEl.appendChild(item);
        });
    }

    // Play video function
    function playVideo(index) {
        const video = videos[index];
        if (!video) return;

        lightboxVideo.src = video.videoUrl;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';

        lightboxVideo.play().catch(e => {
            console.log('Tap play to start');
        });
    }

    // Close lightbox
    function closeLightbox() {
        lightboxVideo.pause();
        lightboxVideo.src = '';
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
    }

    // Scroll to video list
    function scrollToVideoList() {
        document.getElementById('video-list').scrollIntoView({ behavior: 'smooth' });
    }

    // Helper: escape HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // Close lightbox on backdrop click
    lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
    });

    // ESC key to close
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('active')) closeLightbox();
    });

    // Initialize
    renderVideoList();
</script>

</body>
</html>
