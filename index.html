            font-weight: 600;
            border-radius: 50px;

            cursor: pointer;
            border: none;
        }

            box-shadow: 0 4px 12px rgba(244, 63, 94, 0.3);

            background: #1a1a2a;
            position: relative;
            overflow: hidden;
        }

            width: 100%;
            height: 100%;
            object-fit: cover;
        }
